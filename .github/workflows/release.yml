name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  RUST_BACKTRACE: 1

jobs:
  # ═══════════════════════════════════════════════
  # Create GitHub Release (draft)
  # ═══════════════════════════════════════════════
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - name: Create release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            // Beta/RC tags (e.g. v0.72.0-beta.1) publish as GitHub pre-releases
            // — the "体验版" channel, kept separate from the stable "Latest".
            const isPre = /-(beta|rc|alpha)/i.test(tag);
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `AI Reader V2 ${tag}${isPre ? ' (体验版)' : ''}`,
              draft: true,
              prerelease: isPre,
            });
            return data.id;

  # ═══════════════════════════════════════════════
  # Build + Sign + Upload per platform
  # (shared pipeline: .github/workflows/build-desktop.yml)
  # ═══════════════════════════════════════════════
  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS ARM64 (Apple Silicon) — x64 dropped, macos-13 deprecated
          - runner: macos-14
            target: aarch64-apple-darwin

          # Windows x64
          - runner: windows-latest
            target: x86_64-pc-windows-msvc

    uses: ./.github/workflows/build-desktop.yml
    with:
      runner: ${{ matrix.runner }}
      target: ${{ matrix.target }}
      upload: release
    secrets: inherit

  # ═══════════════════════════════════════════════
  # Publish release (undraft)
  # ═══════════════════════════════════════════════
  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft: false,
            });
