name: Build macOS

on:
  workflow_dispatch:

jobs:
  # Note: x64 Intel builds dropped — macos-13 deprecated, PyInstaller can't cross-compile
  # Shared pipeline: .github/workflows/build-desktop.yml
  build-macos:
    uses: ./.github/workflows/build-desktop.yml
    with:
      # macos-14 was retired upstream: dispatching it now fails with
      # "The configuration 'macos-14-arm64-us-default' is not supported".
      runner: macos-15
      target: aarch64-apple-darwin
      upload: artifact
    secrets: inherit
