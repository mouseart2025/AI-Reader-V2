name: Build macOS

on:
  workflow_dispatch:

jobs:
  # Note: x64 Intel builds dropped — macos-13 deprecated, PyInstaller can't cross-compile
  # Shared pipeline: .github/workflows/build-desktop.yml
  build-macos:
    uses: ./.github/workflows/build-desktop.yml
    with:
      runner: macos-14
      target: aarch64-apple-darwin
      upload: artifact
    secrets: inherit
