# GeoEvolve 基因组 v0 —— 现行默认配置的落盘（阶段 0：基线与骨架）
#
# 规格见 docs/analysis/geo-self-evolve-methodology.md §4.1。
# 原则：autoresearch "只改 train.py" 的对应物 —— 所有可变异项收敛到本文件，
# 指标代码 / 黄金数据 / 检测器代码永远不在变异面内（见 frozen_manifest.json）。
#
# 取值口径：阶段 0 只记录"当前值 = 代码现状"。能便宜读到的真实默认值填真值
# （注明 source 文件），读不到的运行时动态值标 TODO 占位，待后续阶段补测。
#
# 基因位分五级，按风险从低到高（§4.1）：
#   level 1 词表/字典类（最安全，ACE 增量 delta 模式，禁止整表重写）
#   level 2 权重/参数类
#   level 3 prompt 类（GEPA 反思变异，每次只改一个文件的一段）
#   level 4 管线结构类（每轮需人工确认）
#   level 5 模型选择类（仅 A/B 对照，不进主进化循环）

version: 0
stage: 0
