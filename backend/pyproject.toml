[project]
name = "ai-reader-v2-backend"
version = "0.77.0-beta.1"
description = "AI Reader V2 Backend - Novel analysis with local LLM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "aiosqlite",
    "chromadb",
    "sentence-transformers",
    "pydantic>=2.0",
    "httpx",
    "websockets",
    "python-multipart",
    "pillow>=11.3.0",
    "opensimplex>=0.4.5.1",
    "jieba>=0.42.1",
    "keyring>=25.7.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "reportlab>=4.4.10",
    "matplotlib>=3.9.4",
    "anthropic>=0.86.0",
    "python-louvain>=0.16",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "opencc-python-reimplemented>=0.1.7",
    "pyinstaller>=6.19.0",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "ruff>=0.16.7",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]
# E501 (line length) intentionally not selected: the codebase has many long
# strings/comments; enforcing 88 chars adds noise without catching real bugs.
ignore = [
    # RUF001/002/003: this codebase intentionally uses CJK full-width
    # punctuation (，。：) in user-facing Chinese strings/docstrings/comments —
    # 1566 hits, all intentional, not confusable-ASCII mistakes.
    "RUF001",
    "RUF002",
    "RUF003",
    # SIM102 (collapsible-if): 52 hits. Style-only; the unsafe auto-fix rarely
    # applies here because the nested ifs carry comments or else branches, and
    # hand-merging 52 sites risks dropping comments for zero behavior gain.
    "SIM102",
    # SIM105 (contextlib.suppress): 14 hits. Style-only try/except-pass blocks;
    # rewriting them adds imports and churn without catching real bugs.
    "SIM105",
]

[tool.ruff.lint.per-file-ignores]
# User actively editing this file; leave its import order untouched for now.
"tests/test_location_relation_semantics.py" = ["I001"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "strict"
markers = [
    "regression: marks tests that require EBOOK_SAMPLE_DIR and ground truth baseline",
]
